name: Contribution snake

# Draws the contribution graph as an animated snake and publishes the SVGs to
# the "output" branch, where the README picks them up.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=2e7de9&color_dots=e1e2e7,b4c6ef,7fa0e8,4b7bd6,2e7de9
            dist/github-snake-dark.svg?color_snake=bb9af7&color_dots=1a1b26,2a3660,3b4f8f,5a79c8,7aa2f7

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
